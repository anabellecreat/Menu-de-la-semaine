<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Mon Menu</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#25211e;--muted:#766e65;--accent:#71805a;--gold:#d7a35c;--line:#e6ded5;--soft:#eee8e0;--bad:#9a5555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
header{padding:22px 18px 12px;position:sticky;top:0;background:rgba(247,244,239,.95);backdrop-filter:blur(14px);z-index:5}h1{margin:0;font-size:30px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{max-width:820px;margin:auto;padding:8px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(40,30,20,.04)}
h2{font-size:22px;margin:2px 0 8px}h3{font-size:17px;margin:0 0 7px}.small{font-size:13px;color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button{border:0;border-radius:13px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}button.secondary{background:var(--soft);color:var(--ink)}button.danger{background:#f0d9d9;color:var(--bad)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:100px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tag{display:inline-block;background:var(--soft);padding:5px 9px;border-radius:999px;font-size:12px;margin:3px 3px 3px 0}.pill{padding:6px 9px;border-radius:999px;background:#e7eedf;color:#52603e;font-size:12px;font-weight:700}
.star{font-size:20px;cursor:pointer}.day{border-left:4px solid var(--accent);padding-left:12px;margin:18px 0}.meal{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin:8px 0}
.suggestion{background:#fbfaf7;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.suggestion.selected{border:2px solid var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{background:none;color:var(--muted);padding:7px 8px;font-size:11px}.active{color:var(--accent)!important}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.48);display:none;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;background:var(--soft);color:var(--ink);border-radius:50%;width:38px;height:38px;padding:0}
.notice{background:#eef2e8;border-radius:15px;padding:12px;font-size:13px}.empty{padding:28px;text-align:center;color:var(--muted)}.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.check input{width:auto;margin:0}.recipe-img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin:8px 0}
@media(min-width:700px){.sheet{max-width:820px;margin:auto}}
</style>
</head>
<body>
<header><h1>Mon Menu 🍋</h1><div class="sub">Gourmand · végétal · protéines · anti-gaspi</div></header>
<main id="app"></main>
<nav>
<button data-tab="week">🗓️<br>Semaine</button><button data-tab="recipes">📚<br>Recettes</button><button data-tab="capture">📸<br>Trouvée</button><button data-tab="shop">🛒<br>Courses</button><button data-tab="more">⚙️<br>Plus</button>
</nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const KEY="mon-menu-v3";
const defaultRecipes=[
{id:"r1",name:"Burrata, tomates & lentilles citronnées",protein:30,tags:["été","méditerranéen","végétarien"],leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["300 g lentilles cuites","2 burratas","500 g tomates cerises","1 sachet roquette","2 c. à soupe pistaches","1 citron","basilic"],steps:"Mélanger les lentilles avec citron, huile d’olive et herbes. Ajouter tomates, roquette et burrata. Terminer avec les pistaches."},
{id:"r2",name:"Orzo méditerranéen, feta & pois chiches",protein:32,tags:["été","frais","végétarien"],leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["250 g orzo","240 g pois chiches égouttés","150 g feta","1 concombre","300 g tomates cerises","olives","basilic","1 citron"],steps:"Cuire l’orzo, refroidir. Mélanger avec pois chiches, feta, concombre, tomates, olives, basilic et citron."},
{id:"r3",name:"Nouilles froides cacahuète, tofu & edamame",protein:35,tags:["asiatique","frais","végétarien"],leftovers:5,rating:0,status:"active",fish:false,asian:true,poke:false,ingredients:["250 g nouilles","300 g tofu","200 g edamame","2 carottes","1 concombre","cacahuètes","sauce soja","beurre de cacahuète","1 citron vert"],steps:"Dorer le tofu. Cuire les nouilles puis refroidir. Mélanger sauce soja, beurre de cacahuète, citron vert et eau. Ajouter légumes, edamame, tofu et cacahuètes."},
{id:"r4",name:"Salade lentilles, halloumi & nectarines",protein:33,tags:["été","frais","végétarien"],leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["300 g lentilles cuites","200 g halloumi","2 nectarines","1 sachet roquette","1 concombre","pistaches","menthe","miel","1 citron"],steps:"Griller le halloumi. Mélanger lentilles, nectarines, concombre, roquette et menthe. Ajouter halloumi, pistaches et vinaigrette miel-citron."},
{id:"r5",name:"Pizza burrata, pesto & roquette",protein:28,tags:["plaisir","italien"],leftovers:2,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["1 pâte à pizza","125 g mozzarella","1 burrata","pesto","tomates cerises","roquette","parmesan"],steps:"Garnir la pâte de mozzarella, pesto et tomates. Cuire à four très chaud. Ajouter burrata, roquette et parmesan à la sortie."},
{id:"r6",name:"Tartines ricotta, tomates & œufs mollets",protein:29,tags:["été","rapide","brunch"],leftovers:2,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["4 tranches pain au levain","250 g ricotta","4 œufs","4 tomates","pistaches","basilic","1 citron"],steps:"Fouetter la ricotta avec citron. Cuire les œufs mollets. Griller le pain, tartiner, ajouter tomates, œufs, basilic et pistaches."},
{id:"r7",name:"Tacos croustillants haricots noirs & feta",protein:30,tags:["mexicain","convivial","végétarien"],leftovers:3,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["8 petites tortillas","240 g haricots noirs","1 petite boîte maïs","100 g cheddar","100 g feta","2 avocats","yaourt grec","1 citron vert","tomates"],steps:"Garnir les tortillas de haricots, maïs et cheddar puis les griller jusqu’à croustillant. Ajouter feta, avocat et sauce yaourt-citron vert."},
{id:"r8",name:"Salade de pâtes burrata, pesto & courgettes",protein:30,tags:["été","italien","frais"],leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["250 g pâtes","1 burrata","2 courgettes","300 g tomates cerises","pesto","roquette","pignons","parmesan"],steps:"Cuire les pâtes puis refroidir. Griller rapidement les courgettes. Mélanger avec tomates, roquette, pesto et parmesan. Ajouter burrata et pignons."},
{id:"r9",name:"Salade grecque protéinée aux pois chiches",protein:28,tags:["été","grec","frais"],leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:["240 g pois chiches","150 g feta","1 concombre","400 g tomates","olives","herbes","pain pita"],steps:"Mélanger pois chiches, feta, concombre, tomates, olives et herbes. Servir avec pita grillée."},
{id:"r10",name:"Curry thaï froid de nouilles, tofu & cacahuète",protein:34,tags:["asiatique","végétarien","frais"],leftovers:5,rating:0,status:"active",fish:false,asian:true,poke:false,ingredients:["250 g nouilles","300 g tofu","200 g edamame","carottes","concombre","lait de coco","citron vert","cacahuètes"],steps:"Cuire puis refroidir les nouilles. Dorer le tofu. Préparer une sauce légère coco-citron vert et mélanger avec les légumes, edamame et cacahuètes."}
];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{recipes:defaultRecipes,week:[],capture:[],pantry:[],history:[],meta:{budget:""}};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function getR(id){return data.recipes.find(r=>r.id===id)}
function esc(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function stars(r,id){return [1,2,3,4,5].map(n=>`<span class="star" onclick="event.stopPropagation();rate('${id}',${n})">${n<=r?"★":"☆"}</span>`).join("")}
let current="week";
function render(tab=current){current=tab;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({week:renderWeek,recipes:renderRecipes,capture:renderCapture,shop:renderShop,more:renderMore}[tab])(document.getElementById("app"))}
function renderWeek(a){
const days=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
a.innerHTML=`<div class="card"><div class="row between"><div><h2>Ma semaine</h2><div class="small">Tu valides seulement quand tout te plaît.</div></div><button onclick="compose()">✨ Composer ma semaine</button></div><div class="notice">L’IA pourra ensuite faire cette sélection automatiquement. Pour l’instant, l’app utilise tes notes, les rotations et tes règles.</div></div>
${days.map(d=>{let its=data.week.filter(x=>x.day===d);return `<div class="day"><h3>${d}</h3>${its.length?its.map(x=>{let r=getR(x.recipeId);return r?`<div class="meal"><div class="row between"><span class="small">${x.meal==="lunch"?"☀️ DÉJEUNER":"🌙 DÎNER"}</span><span class="pill">💪 ${r.protein} g</span></div><div class="row between"><strong>${esc(r.name)}</strong><button class="secondary" onclick="replaceMeal('${x.day}','${x.meal}')">🔄 Changer</button></div><div>${stars(r.rating,r.id)}</div></div>`:""}).join(""):`<div class="small">Pas encore de repas.</div>`}</div>`}).join("")}
${data.week.length?`<div class="card"><div class="row between"><div><strong>Cette proposition te plaît ?</strong><div class="small">La liste de courses sera basée uniquement sur cette version.</div></div><button onclick="validateWeek()">✅ Valider la semaine</button></div></div>`:""}`;
}
function eligible(r,chosen=[],slot=""){if(r.status==="never")return false;if(chosen.includes(r.id))return false;let n=(r.name+" "+r.tags.join(" ")).toLowerCase();if(n.includes("poulet")||n.includes("champignon"))return false;return true}
function score(r,chosen,slot){
let s=0;s+=r.rating*10;if(r.status==="test")s+=8;if(r.leftovers>=5)s+=4;
let used=data.history.slice(-10);if(used.includes(r.id))s-=12;
if(slot==="FridayDinner" && r.tags.includes("plaisir"))s+=20;
if(slot!=="FridayDinner" && r.tags.includes("plaisir"))s-=4;
if(chosen.some(id=>getR(id)?.asian) && r.asian)s-=20;
if(!chosen.some(id=>getR(id)?.asian) && r.asian)s+=8;
if(r.poke && data.history.filter(id=>getR(id)?.poke).length>0)s-=50;
return s;
}
function proposeFor(slot,excludeId=null,chosen=[]){
let pool=data.recipes.filter(r=>eligible(r,chosen)&&r.id!==excludeId);
return pool.sort((a,b)=>score(b,chosen,slot)-score(a,chosen,slot)).slice(0,3);
}
function compose(){
let slots=[["Lundi","dinner"],["Mardi","dinner"],["Mercredi","dinner"],["Jeudi","dinner"],["Vendredi","dinner"],["Samedi","lunch"],["Samedi","dinner"],["Dimanche","lunch"]];
let chosen=[];let plan=[];
for(let [day,meal] of slots){let slot=(day==="Vendredi"&&meal==="dinner")?"FridayDinner":day+meal;let opts=proposeFor(slot,null,chosen);let pick=opts[0];if(pick){plan.push({day,meal,recipeId:pick.id});chosen.push(pick.id)}}
let lunches=[["Mardi","Lundi"],["Mercredi","Mardi"],["Jeudi","Mercredi"],["Vendredi","Jeudi"]];
lunches.forEach(([l,d])=>{let x=plan.find(z=>z.day===d&&z.meal==="dinner");if(x)plan.push({day:l,meal:"lunch",recipeId:x.recipeId})});
data.week=plan;save();showProposal();
}
function showProposal(){
document.getElementById("modalContent").innerHTML=`<h2>✨ Ta proposition</h2><p class="small">J’ai privilégié tes recettes bien notées, les recettes à tester, la variété et les plats qui vivent bien le lendemain. Tu peux remplacer n’importe quel repas avant de valider.</p><div id="proposal">${renderProposal()}</div><button onclick="validateWeek()">✅ Cette semaine me plaît</button>`;
document.getElementById("modal").style.display="flex";
}
function renderProposal(){let order=[["Lundi","dinner"],["Mardi","dinner"],["Mercredi","dinner"],["Jeudi","dinner"],["Vendredi","dinner"],["Samedi","lunch"],["Samedi","dinner"],["Dimanche","lunch"]];return order.map(([d,m])=>{let x=data.week.find(z=>z.day===d&&z.meal===m);let r=x&&getR(x.recipeId);return r?`<div class="suggestion"><div class="row between"><b>${d} · ${m==="lunch"?"Déjeuner":"Dîner"}</b><button class="secondary" onclick="replaceMeal('${d}','${m}',true)">🔄 Changer</button></div><strong>${esc(r.name)}</strong><div>${stars(r.rating,r.id)} · 💪 ${r.protein} g · ♻️ ${r.leftovers}/5</div></div>`:""}).join("")}
function replaceMeal(day,meal,inModal=false){
let x=data.week.find(z=>z.day===day&&z.meal===meal);if(!x)return;let opts=proposeFor(day+meal,x.recipeId,data.week.map(z=>z.recipeId));
document.getElementById("modalContent").innerHTML=`<h2>🔄 Remplacer</h2><p class="small">${day} · ${meal==="lunch"?"déjeuner":"dîner"}</p>${opts.map(r=>`<div class="suggestion"><div class="row between"><strong>${esc(r.name)}</strong><span>💪 ${r.protein} g</span></div><div>${stars(r.rating,r.id)}</div><div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><button onclick="applyReplace('${day}','${meal}','${r.id}',${inModal})">Choisir cette recette</button></div>`).join("")||`<div class="empty">Pas d’alternative disponible.</div>`}`;
document.getElementById("modal").style.display="flex";
}
function applyReplace(day,meal,id,wasModal){let x=data.week.find(z=>z.day===day&&z.meal===meal);if(x)x.recipeId=id;if(meal==="dinner"){let next={Lundi:"Mardi",Mardi:"Mercredi",Mercredi:"Jeudi",Jeudi:"Vendredi"}[day];if(next){let l=data.week.find(z=>z.day===next&&z.meal==="lunch");if(l)l.recipeId=id}}save();wasModal?showProposal():(closeModal(),render("week"))}
function validateWeek(){if(!data.week.length)return;data.history.push(...data.week.filter(x=>x.meal==="dinner").map(x=>x.recipeId));data.history=data.history.slice(-30);save();closeModal();render("week");alert("Semaine validée ! La liste de courses est maintenant basée sur ce menu.")}
function renderRecipes(a){a.innerHTML=`<div class="card"><div class="row between"><div><h2>Mes recettes</h2><div class="small">${data.recipes.length} recettes</div></div><button onclick="newRecipe()">＋ Ajouter</button></div><input id="search" placeholder="Rechercher…" oninput="filterRecipes()"></div><div id="list"></div>`;filterRecipes()}
function filterRecipes(){let q=(document.getElementById("search")?.value||"").toLowerCase();let arr=data.recipes.filter(r=>r.status!=="never"&&(r.name+" "+r.tags.join(" ")+" "+r.ingredients.join(" ")).toLowerCase().includes(q));document.getElementById("list").innerHTML=arr.map(r=>`<div class="card" onclick="openRecipe('${r.id}')"><div class="row between"><h3>${esc(r.name)}</h3><span>${stars(r.rating,r.id)}</span></div><div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="small">💪 ${r.protein} g · ♻️ ${r.leftovers}/5 ${r.status==="test"?"· 💡 À tester":""}</div></div>`).join("")}
function openRecipe(id){let r=getR(id);document.getElementById("modalContent").innerHTML=`<h2>${esc(r.name)}</h2><div>${stars(r.rating,r.id)}</div><p><b>💪 ${r.protein} g</b> · ♻️ restes ${r.leftovers}/5</p><div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><h3>Ingrédients</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Préparation</h3><p>${esc(r.steps)}</p><div class="row"><button onclick="setTest('${r.id}')">💡 À tester</button><button class="danger" onclick="never('${r.id}')">Ne plus proposer</button></div>`;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function rate(id,n){getR(id).rating=n;save();render(current)}
function setTest(id){getR(id).status="test";save();closeModal();render(current)}
function never(id){getR(id).status="never";data.week=data.week.filter(x=>x.recipeId!==id);save();closeModal();render(current)}
function renderCapture(a){a.innerHTML=`<div class="card"><h2>📸 J'ai trouvé une recette</h2><p class="small">Importe une capture. Pour l’instant, tu peux la garder dans « À tester ». Quand l’IA sera connectée, elle pourra lire automatiquement la capture.</p><input id="file" type="file" accept="image/*"><div id="prev"></div><input id="cn" placeholder="Nom (facultatif)"><textarea id="ct" placeholder="Texte ou ingrédients (facultatif)"></textarea><button onclick="saveCap()">📥 Garder dans À tester</button></div><div class="card"><h2>💡 À tester</h2>${data.capture.length?data.capture.map(c=>`<div class="card"><strong>${esc(c.name)}</strong>${c.img?`<img class="recipe-img" src="${c.img}">`:""}<p class="small">${esc(c.text||"")}</p><button class="secondary" onclick="promote('${c.id}')">Ajouter aux recettes</button></div>`).join(""):`<div class="small">Aucune recette sauvegardée.</div>`}</div>`;document.getElementById("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>document.getElementById("prev").innerHTML=`<img class="recipe-img" src="${rd.result}">`;rd.readAsDataURL(f)}}
function saveCap(){let f=document.getElementById("file").files[0],done=img=>{data.capture.push({id:"c"+Date.now(),name:document.getElementById("cn").value||"Recette à tester",text:document.getElementById("ct").value,img:img||""});save();render("capture")};if(f){let rd=new FileReader();rd.onload=()=>done(rd.result);rd.readAsDataURL(f)}else done("")}
function promote(id){let c=data.capture.find(x=>x.id===id);data.recipes.push({id:"r"+Date.now(),name:c.name,protein:0,tags:[],leftovers:5,rating:0,status:"test",fish:false,asian:false,poke:false,ingredients:c.text?c.text.split("\n").filter(Boolean):[],steps:"À compléter",image:c.img});data.capture=data.capture.filter(x=>x.id!==id);save();render("recipes")}
function renderShop(a){let arr=[...new Set(data.week.map(x=>x.recipeId))].flatMap(id=>getR(id)?.ingredients||[]);a.innerHTML=`<div class="card"><h2>🛒 Ma liste de courses</h2><div class="small">Elle est calculée à partir de la semaine validée/proposée.</div></div><div class="card"><h3>♻️ Déjà disponible / restes</h3>${data.pantry.map((p,i)=>`<div class="check"><input type="checkbox"><span>${esc(p)}</span></div>`).join("")}<button class="secondary" onclick="addPantry()">＋ Ajouter</button></div><div class="card"><h3>🛍️ À acheter</h3>${[...new Set(arr)].map(x=>`<label class="check"><input type="checkbox"><span>${esc(x)}</span></label>`).join("")||`<div class="empty">Compose d’abord une semaine.</div>`}</div>`}
function addPantry(){let x=prompt("Produit ou reste à utiliser :");if(x){data.pantry.push(x);save();render("shop")}}
function renderMore(a){a.innerHTML=`<div class="card"><h2>⚙️ Nos règles</h2><p class="small">🌱 dominante végétale<br>🐟 max 1 poisson/semaine<br>🥢 asiatique environ 1 semaine sur 2<br>🍣 poke max 1/mois<br>❌ pas poulet/champignons<br>🍔 vendredi soir = seul cheat meal<br>🍱 dîners adaptés au lendemain<br>🥣 petits-déjeuners hors app</p></div><div class="card"><h2>💰 Budget</h2><input id="budget" value="${esc(data.meta.budget)}" placeholder="Ex. 70 €"><button onclick="data.meta.budget=document.getElementById('budget').value;save();alert('Budget enregistré')">Enregistrer</button></div><div class="card"><h2>💾 Sauvegarde</h2><button onclick="exportData()">Exporter mes données</button><input id="imp" type="file" accept=".json" onchange="importData(event)"><p class="small">Garde une copie de ta bibliothèque et de tes menus.</p></div>`}
function newRecipe(){document.getElementById("modalContent").innerHTML=`<h2>Ajouter une recette</h2><input id="nn" placeholder="Nom"><input id="np" type="number" placeholder="Protéines/portion"><input id="nt" placeholder="Tags"><textarea id="ni" placeholder="Ingrédients, un par ligne"></textarea><textarea id="ns" placeholder="Préparation"></textarea><button onclick="saveNew()">Ajouter</button>`;document.getElementById("modal").style.display="flex"}
function saveNew(){data.recipes.push({id:"r"+Date.now(),name:document.getElementById("nn").value||"Nouvelle recette",protein:+document.getElementById("np").value||0,tags:document.getElementById("nt").value.split(",").map(x=>x.trim()).filter(Boolean),leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false,ingredients:document.getElementById("ni").value.split("\n").filter(Boolean),steps:document.getElementById("ns").value});save();closeModal();render("recipes")}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mon-menu.json";a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{data=JSON.parse(rd.result);save();render(current);alert("Import réussi")}catch{alert("Fichier invalide")}};rd.readAsText(f)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>render(b.dataset.tab));render();
</script>
</body></html>
