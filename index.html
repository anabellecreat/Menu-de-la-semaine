<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Mon Menu</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#25211e;--muted:#766e65;--accent:#71805a;--gold:#d7a35c;--line:#e6ded5;--soft:#eee8e0;--bad:#8f5555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
header{padding:22px 18px 12px;position:sticky;top:0;background:rgba(247,244,239,.95);backdrop-filter:blur(14px);z-index:5}h1{margin:0;font-size:30px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{max-width:800px;margin:auto;padding:8px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(40,30,20,.04)}
h2{font-size:21px;margin:2px 0 10px}h3{font-size:17px;margin:0 0 7px}.small{font-size:13px;color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button{border:0;border-radius:13px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}button.secondary{background:var(--soft);color:var(--ink)}button.danger{background:#f0d9d9;color:var(--bad)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tag{display:inline-block;background:var(--soft);padding:5px 9px;border-radius:999px;font-size:12px;margin:3px 3px 3px 0}
.star{font-size:21px;cursor:pointer}.recipe{cursor:pointer}.recipe:hover{transform:translateY(-1px)}.recipe-thumb{width:100%;max-height:210px;object-fit:cover;border-radius:14px;margin:8px 0}
.day{border-left:4px solid var(--accent);padding-left:12px;margin:18px 0}.slot{padding:12px;background:#fff;border:1px solid var(--line);border-radius:15px;margin:8px 0}.slot b{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.check input{width:auto;margin:0}.pill{padding:6px 9px;border-radius:999px;background:#e7eedf;color:#52603e;font-size:12px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{background:none;color:var(--muted);padding:7px 8px;font-size:11px}.active{color:var(--accent)!important}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.48);display:none;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;background:var(--soft);color:var(--ink);border-radius:50%;width:38px;height:38px;padding:0}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}.notice{background:#eef2e8;border-radius:15px;padding:12px;font-size:13px}.dangerText{color:var(--bad)}
@media(min-width:700px){.sheet{max-width:800px;margin:auto}}
</style>
</head>
<body>
<header><h1>Mon Menu 🍋</h1><div class="sub">Gourmand · végétal · protéines · anti-gaspi</div></header>
<main id="app"></main>
<nav>
<button data-tab="week">🗓️<br>Semaine</button>
<button data-tab="recipes">📚<br>Recettes</button>
<button data-tab="capture">📸<br>Trouvée</button>
<button data-tab="shop">🛒<br>Courses</button>
<button data-tab="more">⚙️<br>Plus</button>
</nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const KEY="mon-menu-v2";
const RULES={no:["poulet","champignon"],fishMax:1,pokeMaxPerMonth:1,asianEveryOtherWeek:true,cheat:"vendredi soir",breakfast:false};
const recipes=[
{id:"r1",name:"Burrata, tomates & lentilles citronnées",protein:30,tags:["été","méditerranéen","végétarien"],leftovers:5,ingredients:["300 g lentilles cuites","2 burratas","500 g tomates cerises","1 sachet roquette","2 c. à soupe pistaches","1 citron","basilic"],steps:"Mélanger les lentilles avec citron, huile d’olive et herbes. Ajouter tomates, roquette et burrata. Terminer avec les pistaches.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r2",name:"Orzo méditerranéen, feta & pois chiches",protein:32,tags:["été","frais","végétarien"],leftovers:5,ingredients:["250 g orzo","240 g pois chiches égouttés","150 g feta","1 concombre","300 g tomates cerises","olives","basilic","1 citron"],steps:"Cuire l’orzo, refroidir. Mélanger avec pois chiches, feta, concombre, tomates, olives, basilic et citron.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r3",name:"Nouilles froides cacahuète, tofu & edamame",protein:35,tags:["asiatique","frais","végétarien"],leftovers:5,ingredients:["250 g nouilles","300 g tofu","200 g edamame","2 carottes","1 concombre","cacahuètes","sauce soja","beurre de cacahuète","1 citron vert"],steps:"Dorer le tofu. Cuire les nouilles puis refroidir. Mélanger sauce soja, beurre de cacahuète, citron vert et eau. Ajouter légumes, edamame, tofu et cacahuètes.",rating:0,status:"active",fish:false,asian:true,poke:false},
{id:"r4",name:"Salade lentilles, halloumi & nectarines",protein:33,tags:["été","frais","végétarien"],leftovers:5,ingredients:["300 g lentilles cuites","200 g halloumi","2 nectarines","1 sachet roquette","1 concombre","pistaches","menthe","miel","1 citron"],steps:"Griller le halloumi. Mélanger lentilles, nectarines, concombre, roquette et menthe. Ajouter halloumi, pistaches et vinaigrette miel-citron.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r5",name:"Pizza burrata, pesto & roquette",protein:28,tags:["plaisir","italien"],leftovers:2,ingredients:["1 pâte à pizza","125 g mozzarella","1 burrata","pesto","tomates cerises","roquette","parmesan"],steps:"Garnir la pâte de mozzarella, pesto et tomates. Cuire à four très chaud. Ajouter burrata, roquette et parmesan à la sortie.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r6",name:"Tartines ricotta, tomates & œufs mollets",protein:29,tags:["été","rapide","brunch"],leftovers:2,ingredients:["4 tranches pain au levain","250 g ricotta","4 œufs","4 tomates","pistaches","basilic","1 citron"],steps:"Fouetter la ricotta avec citron. Cuire les œufs mollets. Griller le pain, tartiner, ajouter tomates, œufs, basilic et pistaches.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r7",name:"Tacos croustillants haricots noirs & feta",protein:30,tags:["mexicain","convivial","végétarien"],leftovers:3,ingredients:["8 petites tortillas","240 g haricots noirs","1 petite boîte maïs","100 g cheddar","100 g feta","2 avocats","yaourt grec","1 citron vert","tomates"],steps:"Garnir les tortillas de haricots, maïs et cheddar puis les griller jusqu’à croustillant. Ajouter feta, avocat et sauce yaourt-citron vert.",rating:0,status:"active",fish:false,asian:false,poke:false},
{id:"r8",name:"Salade de pâtes burrata, pesto & courgettes",protein:30,tags:["été","italien","frais"],leftovers:5,ingredients:["250 g pâtes","1 burrata","2 courgettes","300 g tomates cerises","pesto","roquette","pignons","parmesan"],steps:"Cuire les pâtes puis refroidir. Griller rapidement les courgettes. Mélanger avec tomates, roquette, pesto et parmesan. Ajouter burrata et pignons.",rating:0,status:"active",fish:false,asian:false,poke:false}
];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{recipes,week:[],capture:[],pantry:[],meta:{budget:"",notes:""}};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function getR(id){return data.recipes.find(r=>r.id===id)}
function stars(r,id){return [1,2,3,4,5].map(n=>`<span class="star" onclick="event.stopPropagation();rate('${id}',${n})">${n<=r?"★":"☆"}</span>`).join("")}
let current="week";
function render(tab=current){current=tab;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let a=document.getElementById("app");({week:renderWeek,recipes:renderRecipes,capture:renderCapture,shop:renderShop,more:renderMore}[tab])(a)}
function renderWeek(a){
 const days=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
 a.innerHTML=`<div class="card"><div class="row between"><div><h2>Ma semaine</h2><div class="small">Déjeuners & dîners · pas de petits-déjeuners</div></div><button onclick="compose()">✨ Composer</button></div>
 <div class="notice">🌱 Dominante végétale · 🐟 poisson max 1/semaine · 🥢 asiatique environ 1 semaine sur 2 · 🍣 poke max 1/mois · ❌ pas de poulet/champignons · 🍔 vendredi soir = repas plaisir.</div></div>
 ${days.map(d=>{let its=data.week.filter(x=>x.day===d);return `<div class="day"><h3>${d}</h3>${its.length?its.map(x=>{let r=getR(x.recipeId);return r?`<div class="slot recipe" onclick="openRecipe('${r.id}')"><div class="row between"><b>${x.meal==="lunch"?"☀️ DÉJEUNER":"🌙 DÎNER"}</b><span class="pill">💪 ${r.protein} g</span></div><div><strong>${esc(r.name)}</strong></div><div>${stars(r.rating,r.id)}</div></div>`:""}).join(""):`<div class="small">Aucun repas planifié.</div>`}</div>`}).join("")}`;
}
function renderRecipes(a){
 a.innerHTML=`<div class="card"><div class="row between"><div><h2>Mes recettes</h2><div class="small">${data.recipes.length} recettes · ⭐ = tes préférées</div></div><button onclick="newRecipe()">＋ Ajouter</button></div><input id="search" placeholder="Rechercher une recette ou un ingrédient…" oninput="filterRecipes()"></div><div id="recipeList"></div>`;
 filterRecipes();
}
function filterRecipes(){
 let q=(document.getElementById("search")?.value||"").toLowerCase(), arr=data.recipes.filter(r=>r.status!=="never"&&(r.name+" "+r.ingredients.join(" ")+" "+r.tags.join(" ")).toLowerCase().includes(q));
 document.getElementById("recipeList").innerHTML=arr.map(r=>`<div class="card recipe" onclick="openRecipe('${r.id}')"><div class="row between"><h3>${esc(r.name)}</h3><span>${stars(r.rating,r.id)}</span></div><div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="small">💪 ~${r.protein} g · ♻️ restes ${r.leftovers}/5 ${r.status==="test"?"· 💡 À tester":""}</div></div>`).join("")||`<div class="empty">Aucune recette trouvée.</div>`;
}
function renderCapture(a){
 a.innerHTML=`<div class="card"><h2>📸 J'ai trouvé une recette !</h2><p class="small">Ajoute une capture d’écran, puis complète si besoin. Elle reste dans « À tester » jusqu’à ce que tu décides de la garder.</p>
 <input id="file" type="file" accept="image/*"><div id="preview"></div>
 <input id="cn" placeholder="Nom de la recette"><textarea id="ct" placeholder="Texte/ingrédients copiés depuis le réseau (facultatif)"></textarea>
 <div class="grid"><input id="cp" type="number" placeholder="Protéines/portion"><input id="cg" placeholder="Tags : été, asiatique…"></div>
 <button onclick="saveCapture()">📥 Garder dans « À tester »</button></div>
 <div class="card"><h2>💡 À tester</h2>${data.capture.length?data.capture.map(c=>`<div class="card"><div class="row between"><strong>${esc(c.name)}</strong><button class="secondary" onclick="promote('${c.id}')">Ajouter aux recettes</button></div>${c.img?`<img class="recipe-thumb" src="${c.img}">`:""}<div class="small">${esc(c.text||"")}</div></div>`).join(""):`<div class="small">Aucune trouvaille pour le moment.</div>`}</div>`;
 document.getElementById("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>document.getElementById("preview").innerHTML=`<img class="recipe-thumb" src="${rd.result}">`;rd.readAsDataURL(f)}
}
function renderShop(a){
 let items=shopping();
 a.innerHTML=`<div class="card"><div class="row between"><div><h2>🛒 Liste de courses</h2><div class="small">Basée sur les recettes validées</div></div><button class="secondary" onclick="window.print()">Imprimer</button></div>${data.meta.budget?`<p class="small">Budget cible : ${esc(data.meta.budget)}</p>`:""}</div>
 <div class="card"><h3>♻️ À utiliser / déjà disponible</h3>${data.pantry.length?data.pantry.map((x,i)=>`<div class="check"><input type="checkbox" onchange="this.parentElement.style.textDecoration=this.checked?'line-through':''"><span>${esc(x)}</span></div>`).join(""):`<div class="small">Ajoute ici tes restes ou produits déjà dans les placards.</div>`}<button class="secondary" onclick="addPantry()">＋ Ajouter un reste</button></div>
 <div class="card"><h3>🛍️ À acheter</h3>${items.length?items.map(x=>`<label class="check"><input type="checkbox" onchange="this.parentElement.style.textDecoration=this.checked?'line-through':''"><span>${esc(x)}</span></label>`).join(""):`<div class="small">Valide une semaine pour générer la liste.</div>`}</div>`;
}
function shopping(){let ids=[...new Set(data.week.map(x=>x.recipeId))], arr=[];ids.forEach(id=>{let r=getR(id);if(r)r.ingredients.forEach(i=>arr.push(i))});let pantry=data.pantry.map(x=>x.toLowerCase());return [...new Set(arr)].filter(i=>!pantry.some(p=>i.toLowerCase().includes(p)||p.includes(i.toLowerCase())))}
function renderMore(a){
 a.innerHTML=`<div class="card"><h2>⚙️ Mes règles</h2><div class="small">Ces règles guident la construction des semaines.</div><p>🌱 Dominante végétale<br>🐟 Maximum 1 poisson par semaine<br>🥢 Asiatique environ 1 semaine sur 2<br>🍣 Poke bowl : 1 fois par mois maximum<br>❌ Pas de poulet ni champignons<br>🍔 Vendredi soir = seul cheat meal<br>🍱 Les dîners doivent bien vivre jusqu’au déjeuner du lendemain<br>🥣 Petits-déjeuners : hors application</p></div>
 <div class="card"><h2>💰 Budget</h2><input id="budget" value="${esc(data.meta.budget)}" placeholder="Ex. 70 €"><button onclick="data.meta.budget=document.getElementById('budget').value;save();alert('Budget enregistré')">Enregistrer</button></div>
 <div class="card"><h2>♻️ Restes / placards</h2><textarea id="notes" placeholder="Ex. 1/2 pot de pesto, 1 paquet de lentilles, feta…">${esc(data.meta.notes)}</textarea><button onclick="data.meta.notes=document.getElementById('notes').value;save();alert('Notes enregistrées')">Enregistrer</button></div>
 <div class="card"><h2>💾 Mes données</h2><div class="row"><button onclick="exportData()">Exporter</button><button class="secondary" onclick="document.getElementById('imp').click()">Importer</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><p class="small">Utile pour garder une sauvegarde de ta bibliothèque et de tes menus.</p></div>`;
}
function openRecipe(id){let r=getR(id);if(!r)return;document.getElementById("modalContent").innerHTML=`<h2>${esc(r.name)}</h2>${r.image?`<img class="recipe-thumb" src="${r.image}">`:""}<div>${stars(r.rating,r.id)}</div><p><b>💪 ${r.protein} g</b> · ♻️ restes ${r.leftovers}/5</p><div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><hr><h3>Ingrédients</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Préparation</h3><p>${esc(r.steps)}</p><hr><div class="row"><button onclick="addToNextWeek('${r.id}')">🗓️ Proposer la semaine prochaine</button><button class="secondary" onclick="setTest('${r.id}')">💡 À tester</button><button class="danger" onclick="never('${r.id}')">Ne plus proposer</button></div>`;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function rate(id,n){let r=getR(id);r.rating=n;save();render(current)}
function setTest(id){let r=getR(id);r.status="test";save();closeModal();render(current)}
function never(id){let r=getR(id);r.status="never";data.week=data.week.filter(x=>x.recipeId!==id);save();closeModal();render(current)}
function addToNextWeek(id){let r=getR(id);r.status="test";save();closeModal();alert("Ajoutée à la sélection « À tester ».")}
function newRecipe(){document.getElementById("modalContent").innerHTML=`<h2>Ajouter une recette</h2><input id="nn" placeholder="Nom"><input id="np" type="number" placeholder="Protéines/portion"><input id="nt" placeholder="Tags séparés par des virgules"><textarea id="ni" placeholder="Un ingrédient par ligne"></textarea><textarea id="ns" placeholder="Préparation"></textarea><button onclick="saveNew()">Ajouter</button>`;document.getElementById("modal").style.display="flex"}
function saveNew(){data.recipes.push({id:"r"+Date.now(),name:document.getElementById("nn").value||"Nouvelle recette",protein:+document.getElementById("np").value||0,tags:document.getElementById("nt").value.split(",").map(x=>x.trim()).filter(Boolean),ingredients:document.getElementById("ni").value.split("\n").filter(Boolean),steps:document.getElementById("ns").value,leftovers:5,rating:0,status:"active",fish:false,asian:false,poke:false});save();closeModal();render("recipes")}
function saveCapture(){let f=document.getElementById("file").files[0],done=img=>{data.capture.push({id:"c"+Date.now(),name:document.getElementById("cn").value||"Recette à tester",text:document.getElementById("ct").value,protein:+document.getElementById("cp").value||0,tags:document.getElementById("cg").value.split(",").map(x=>x.trim()).filter(Boolean),img:img||""});save();render("capture")};if(f){let rd=new FileReader();rd.onload=()=>done(rd.result);rd.readAsDataURL(f)}else done("")}
function promote(id){let c=data.capture.find(x=>x.id===id);if(!c)return;data.recipes.push({id:"r"+Date.now(),name:c.name,protein:c.protein||0,tags:c.tags||[],ingredients:c.text?c.text.split("\n").filter(Boolean):[],steps:"À compléter",leftovers:5,rating:0,status:"test",image:c.img});data.capture=data.capture.filter(x=>x.id!==id);save();render("recipes")}
function addPantry(){let x=prompt("Produit/restant à utiliser :");if(x){data.pantry.push(x);save();render("shop")}}
function compose(){let choices=data.recipes.filter(r=>r.status!=="never");let slots=[["Lundi","dinner"],["Mardi","dinner"],["Mercredi","dinner"],["Jeudi","dinner"],["Vendredi","dinner"],["Samedi","lunch"],["Samedi","dinner"],["Dimanche","lunch"]];document.getElementById("modalContent").innerHTML=`<h2>Composer la semaine</h2><p class="small">Les déjeuners mardi→vendredi reprennent automatiquement le dîner de la veille. Les créneaux sont indépendants pour le week-end.</p>${slots.map((s,i)=>`<label>${s[0]} — ${s[1]==="lunch"?"déjeuner":"dîner"}<select id="s${i}"><option value="">— choisir —</option>${choices.map(r=>`<option value="${r.id}">${esc(r.name)}${r.rating>=4?" ★":""}</option>`).join("")}</select></label>`).join("")}<button onclick="saveWeek()">Valider la semaine</button>`;document.getElementById("modal").style.display="flex"}
function saveWeek(){let slots=[["Lundi","dinner"],["Mardi","dinner"],["Mercredi","dinner"],["Jeudi","dinner"],["Vendredi","dinner"],["Samedi","lunch"],["Samedi","dinner"],["Dimanche","lunch"]];data.week=[];slots.forEach((s,i)=>{let v=document.getElementById("s"+i).value;if(v)data.week.push({day:s[0],meal:s[1],recipeId:v})});let map={Mardi:"Lundi",Mercredi:"Mardi",Jeudi:"Mercredi",Vendredi:"Jeudi"};Object.entries(map).forEach(([l,d])=>{let x=data.week.find(z=>z.day===d&&z.meal==="dinner");if(x)data.week.push({day:l,meal:"lunch",recipeId:x.recipeId})});save();closeModal();render("week")}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mon-menu-sauvegarde.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{data=JSON.parse(rd.result);save();render(current);alert("Sauvegarde importée")}catch{alert("Fichier invalide")}};rd.readAsText(f)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>render(b.dataset.tab));
render();
</script>
</body>
</html>
